name: Apply Name_N identity fix
on:
  workflow_dispatch:
  push:
    branches: [fix/name-n-identity-v2]
    paths:
      - "patches/**"
      - "scripts/apply_name_n_identity.sh"
      - ".github/workflows/apply-name-n-identity.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/name-n-identity-v2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patches
        run: bash scripts/apply_name_n_identity.sh

      - name: Verify tests
        run: |
          pip install pytest -q
          PYTHONPATH=python python -m pytest python/tests/test_import_identity.py -q --tb=line

      - name: Commit applied sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/extract.py python/build.py
          if git diff --staged --quiet; then
            echo "Already applied — nothing to commit"
          else
            git commit -m "fix: apply Name_N identity matching in extract+build"
            git push origin HEAD:fix/name-n-identity-v2
          fi
